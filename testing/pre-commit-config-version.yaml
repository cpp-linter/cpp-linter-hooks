repos:
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=16]  # to load .clang-format
      - id: clang-tidy
        args: [--version=16]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=17]
      - id: clang-tidy
        args: [--version=17]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=18]
      - id: clang-tidy
        args: [--version=18]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=19]
      - id: clang-tidy
        args: [--version=19]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=20]
      - id: clang-tidy
        args: [--version=20]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=21]
      - id: clang-tidy
        args: [--version=21]
  - repo: .
    rev: HEAD
    hooks:
      - id: clang-format
        args: [--style=file, --version=22]
      - id: clang-tidy
        args: [--version=22]
